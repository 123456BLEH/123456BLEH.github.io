<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Colors Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Vibrant gradient background */
        body { 
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff); 
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #333; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Bar for Menu Alignment */
        .header-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            position: relative;
        }

        /* The Dropdown Container */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        /* The Menu Button itself */
        .menu-btn {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Dropdown content container (hidden by default) */
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            z-index: 1;
            overflow: hidden;
            margin-top: 5px;
        }

        /* Links inside the dropdown menu */
        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Make links change color when you hover over them */
        .dropdown-content a:hover {
            background-color: #ff007f;
            color: white;
        }

        /* Show the dropdown menu when hovering or clicking */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Main Card Setup */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            max-width: 500px; 
            width: 100%; 
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(45deg, #ff007f, #00f0ff); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; margin-bottom: 10px; color: #111; }
        .subtitle { font-size: 16px; color: #7f00ff; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Header bar containing the dropdown menu -->
    <div class="header-bar">
        <div class="dropdown">
            <button class="menu-btn">Menu ▼</button>
            <div class="dropdown-content">
                <a href="#help">Help & Bug Reports</a>
                <a href="#vibrantColors">Vibrant Colors</a>
                <a href="#credits">Credits</a>
            </div>
        </div>
    </div>

    <!-- Main site content card -->
    <div class="card">
        <div class="profile-pic">🎨</div>
        <h1>Your Name</h1>
        <div class="subtitle">Vibrant Colors Page</div>
        <p>Welcome to my bright and colorful site! I added a fully functioning dropdown menu just like a pro coder.</p>
    </div>

</body>
</html>
