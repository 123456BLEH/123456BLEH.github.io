<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: skyblue; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; background: #e0e0e0; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #111; }
        .subtitle { font-size: 16px; color: #666; margin-bottom: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 30px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; background: #0070f3; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #0051b3; }
        .btn.secondary { background: #333; }
        .btn.secondary:hover { background: #111; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Icon (You can change this emoji!) -->
        <div class="profile-pic">👋</div>
        
        <!-- YOUR NAME HERE -->
        <h1>Anastasia Browne</h1>
        
        <!-- YOUR SUBTITLE HERE -->
        <div class="subtitle">Middle School Student</div>
        
        <!-- YOUR BIO HERE -->
        <p>Wlecome.I will show you colors and stuff, idk.</p>
        
        <!-- YOUR BUTTON LINKS HERE -->
        <div class="links">
        </div>
    </div>

</body>
</html>
